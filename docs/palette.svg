<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="266"
  viewBox="0 0 720 266"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Beauty.css color palettes</title>
  <desc id="desc">
    Light and dark defaults for background, body text, headings, secondary text, links and hover.
    Full color tokens are listed in the README.
  </desc>
  <g font-family="system-ui, -apple-system, sans-serif">
    <g transform="translate(0 0)">
      <rect x="0.5" y="0.5" width="349" height="265" rx="10" fill="#ffffff" stroke="#d5dadd" />
      <text x="22" y="34" fill="#222222" font-size="22" font-weight="600">Light</text>
      <text x="22" y="57" fill="#556677" font-size="13">Default palette</text>
      <g aria-label="Light Background: #ffffff">
        <rect x="22" y="80" width="94" height="36" rx="4" fill="#ffffff" stroke="#7d8892" />
        <text x="22" y="134" fill="#222222" font-size="13">Background</text>
        <text x="22" y="152" fill="#556677" font-size="12" font-family="ui-monospace, monospace">
          #ffffff
        </text>
      </g>
      <g aria-label="Light Body text: #444444">
        <rect x="126" y="80" width="94" height="36" rx="4" fill="#444444" stroke="#7d8892" />
        <text x="126" y="134" fill="#222222" font-size="13">Body text</text>
        <text x="126" y="152" fill="#556677" font-size="12" font-family="ui-monospace, monospace">
          #444444
        </text>
      </g>
      <g aria-label="Light Headings: #222222">
        <rect x="230" y="80" width="94" height="36" rx="4" fill="#222222" stroke="#7d8892" />
        <text x="230" y="134" fill="#222222" font-size="13">Headings</text>
        <text x="230" y="152" fill="#556677" font-size="12" font-family="ui-monospace, monospace">
          #222222
        </text>
      </g>
      <g aria-label="Light Secondary: #556677">
        <rect x="22" y="174" width="94" height="36" rx="4" fill="#556677" stroke="#7d8892" />
        <text x="22" y="228" fill="#222222" font-size="13">Secondary</text>
        <text x="22" y="246" fill="#556677" font-size="12" font-family="ui-monospace, monospace">
          #556677
        </text>
      </g>
      <g aria-label="Light Links: #0060a0">
        <rect x="126" y="174" width="94" height="36" rx="4" fill="#0060a0" stroke="#7d8892" />
        <text x="126" y="228" fill="#222222" font-size="13">Links</text>
        <text x="126" y="246" fill="#556677" font-size="12" font-family="ui-monospace, monospace">
          #0060a0
        </text>
      </g>
      <g aria-label="Light Hover: #b73700">
        <rect x="230" y="174" width="94" height="36" rx="4" fill="#b73700" stroke="#7d8892" />
        <text x="230" y="228" fill="#222222" font-size="13">Hover</text>
        <text x="230" y="246" fill="#556677" font-size="12" font-family="ui-monospace, monospace">
          #b73700
        </text>
      </g>
    </g>
    <g transform="translate(370 0)">
      <rect x="0.5" y="0.5" width="349" height="265" rx="10" fill="#1a1a1a" stroke="#454b51" />
      <text x="22" y="34" fill="#e8e8e8" font-size="22" font-weight="600">Dark</text>
      <text x="22" y="57" fill="#a7b2bc" font-size="13">Default palette</text>
      <g aria-label="Dark Background: #1a1a1a">
        <rect x="22" y="80" width="94" height="36" rx="4" fill="#1a1a1a" stroke="#737e88" />
        <text x="22" y="134" fill="#e8e8e8" font-size="13">Background</text>
        <text x="22" y="152" fill="#a7b2bc" font-size="12" font-family="ui-monospace, monospace">
          #1a1a1a
        </text>
      </g>
      <g aria-label="Dark Body text: #c7ccd1">
        <rect x="126" y="80" width="94" height="36" rx="4" fill="#c7ccd1" stroke="#737e88" />
        <text x="126" y="134" fill="#e8e8e8" font-size="13">Body text</text>
        <text x="126" y="152" fill="#a7b2bc" font-size="12" font-family="ui-monospace, monospace">
          #c7ccd1
        </text>
      </g>
      <g aria-label="Dark Headings: #e8e8e8">
        <rect x="230" y="80" width="94" height="36" rx="4" fill="#e8e8e8" stroke="#737e88" />
        <text x="230" y="134" fill="#e8e8e8" font-size="13">Headings</text>
        <text x="230" y="152" fill="#a7b2bc" font-size="12" font-family="ui-monospace, monospace">
          #e8e8e8
        </text>
      </g>
      <g aria-label="Dark Secondary: #a7b2bc">
        <rect x="22" y="174" width="94" height="36" rx="4" fill="#a7b2bc" stroke="#737e88" />
        <text x="22" y="228" fill="#e8e8e8" font-size="13">Secondary</text>
        <text x="22" y="246" fill="#a7b2bc" font-size="12" font-family="ui-monospace, monospace">
          #a7b2bc
        </text>
      </g>
      <g aria-label="Dark Links: #6ab0e6">
        <rect x="126" y="174" width="94" height="36" rx="4" fill="#6ab0e6" stroke="#737e88" />
        <text x="126" y="228" fill="#e8e8e8" font-size="13">Links</text>
        <text x="126" y="246" fill="#a7b2bc" font-size="12" font-family="ui-monospace, monospace">
          #6ab0e6
        </text>
      </g>
      <g aria-label="Dark Hover: #ff986c">
        <rect x="230" y="174" width="94" height="36" rx="4" fill="#ff986c" stroke="#737e88" />
        <text x="230" y="228" fill="#e8e8e8" font-size="13">Hover</text>
        <text x="230" y="246" fill="#a7b2bc" font-size="12" font-family="ui-monospace, monospace">
          #ff986c
        </text>
      </g>
    </g>
  </g>
</svg>
